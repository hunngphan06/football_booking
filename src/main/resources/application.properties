spring.application.name=football-booking
spring.datasource.url=jdbc:postgresql://localhost:5432/football_booking
spring.datasource.username=football_app
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false

assistant.api-key=${GROQ_API_KEY:}
springdoc.swagger-ui.path=/swagger-ui.html

server.servlet.session.cookie.same-site=lax
booking.admin.email=${BOOKING_ADMIN_EMAIL:}
booking.admin.password=${BOOKING_ADMIN_PASSWORD:}

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
