spring.application.name=football-booking
spring.datasource.url=jdbc:postgresql://localhost:5432/football_booking
spring.datasource.username=football_app
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false

# Set these environment variables when enabling the AI assistant.
assistant.api-key=${AI_API_KEY:}
assistant.base-url=${AI_BASE_URL:https://api.openai.com/v1}
assistant.model=${AI_MODEL:gpt-4.1-mini}
springdoc.swagger-ui.path=/swagger-ui.html

server.servlet.session.cookie.same-site=lax
booking.admin.email=${BOOKING_ADMIN_EMAIL:}
booking.admin.password=${BOOKING_ADMIN_PASSWORD:}
