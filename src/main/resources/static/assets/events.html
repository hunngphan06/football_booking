<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Tìm và đặt vé bóng đá, phim và ca nhạc trên Event Booking.">
    <title>Sự kiện · Event Booking</title>
    <link rel="stylesheet" href="/assets/booking.css">
    <link rel="stylesheet" href="/assets/navigation.css">
    <link rel="stylesheet" href="/assets/catalog.css">
    <script type="module" src="/assets/events.js"></script>
</head>
<body class="catalog-page">
<header id="site-header" class="site-header"></header>
<main class="catalog-main">
    <section class="feature" aria-labelledby="feature-title">
        <div class="feature-media" id="feature-media" aria-hidden="true"></div>
        <div class="feature-inner">
            <p class="feature-label" id="feature-label" hidden>Sự kiện nổi bật</p>
            <h1 id="feature-title">Khám phá sự kiện</h1>
            <p class="feature-meta" id="feature-meta" hidden></p>
            <a class="feature-link" id="feature-link" href="#events-heading">Xem sự kiện</a>
        </div>
    </section>
    <section class="catalog" aria-labelledby="events-heading">
        <div class="catalog-heading">
            <h2 id="events-heading">Khám phá sự kiện</h2>
            <label class="catalog-search">
                <span class="visually-hidden">Tìm theo tên hoặc địa điểm</span>
                <span class="search-icon" aria-hidden="true"></span>
                <input type="search" id="search" placeholder="Tìm tên sự kiện hoặc địa điểm">
            </label>
        </div>
        <div class="catalog-toolbar">
            <div class="category-buttons" id="category-filter" role="group" aria-label="Lọc theo danh mục"></div>
            <button class="text-button" id="reset-filters" type="button" hidden>Xóa bộ lọc</button>
            <details class="catalog-assistant" id="catalog-assistant">
                <summary>Tìm bằng trợ lý</summary>
                <form id="assistant-search">
                    <label for="assistant-query">Bạn muốn tìm sự kiện nào?</label>
                    <input id="assistant-query" name="query" required maxlength="2000" placeholder="Ví dụ: phim dưới 100.000 ₫">
                    <button class="primary" type="submit">Tìm sự kiện</button>
                </form>
            </details>
        </div>
        <p class="catalog-count" id="event-count" aria-live="polite"></p>
        <p id="event-message" class="notice" role="status"></p>
        <p id="assistant-message" class="notice" role="status"></p>
        <button class="secondary" id="reload" type="button" hidden>Tải lại sự kiện</button>
        <div id="event-cards" class="cards catalog-cards" aria-busy="true">
            <div class="card-loading" aria-hidden="true"></div>
            <div class="card-loading" aria-hidden="true"></div>
            <div class="card-loading" aria-hidden="true"></div>
        </div>
    </section>
</main>
</body>
</html>
