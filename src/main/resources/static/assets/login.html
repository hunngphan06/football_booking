<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng nhập · Event Booking</title>
    <link rel="stylesheet" href="/assets/booking.css">
    <link rel="stylesheet" href="/assets/login.css">
    <script type="module" src="/assets/auth.js"></script>
</head>
<body class="login-page">
<main class="login-layout">
    <div class="login-background" id="login-background" aria-hidden="true"></div>
    <section class="login-card" aria-labelledby="auth-heading">
        <h1 id="auth-heading">Đăng nhập</h1>
        <form id="login" method="post" action="/api/auth/login">
            <label>Email<input type="email" name="email" autocomplete="username" required></label>
            <label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required></label>
            <button class="login-forgot" id="forgot-password" type="button" aria-haspopup="dialog">Quên mật khẩu?</button>
            <button class="primary" type="submit">Đăng nhập</button>
        </form>
        <p class="notice" role="status" id="auth-message"></p>
        <p class="login-switch">Chưa có tài khoản? <a id="register-link" href="/register">Đăng ký</a></p>
    </section>
    <dialog class="login-card login-dialog" id="password-help-dialog" aria-labelledby="password-help-title" aria-describedby="password-help-text">
        <h2 id="password-help-title">Quên mật khẩu?</h2>
        <p id="password-help-text">Tính năng gửi email đặt lại mật khẩu chưa được bật. Nếu cần lấy lại quyền truy cập, hãy liên hệ quản trị viên.</p>
        <form method="dialog"><button class="primary" type="submit">Đóng</button></form>
    </dialog>
</main>
</body>
</html>
